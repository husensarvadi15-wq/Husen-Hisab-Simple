name: Build Husen Stock Manager APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q HusenStockManager_Source.zip -d extracted

      - name: Build APK
        run: |
          gradle -p extracted/HusenStockManager assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Husen-Stock-Manager-APK
          path: extracted/HusenStockManager/app/build/outputs/apk/debug/app-debug.apk
          
