
name: Build Husen Hisab Customer Demo APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract ZIP
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f -name package.json -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "package.json not found in ZIP"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/www/index.html" ]; then
            echo "www/index.html not found inside project"
            exit 1
          fi

          cp "$PROJECT_DIR/package.json" ./package.json
          rm -rf www
          cp -R "$PROJECT_DIR/www" ./www

      - name: Setup Capacitor
        run: |
          npm install
          npm install @capacitor/core@6.2.1 @capacitor/android@6.2.1
          npm install --save-dev @capacitor/cli@6.2.1

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.husen.hisab.demo",
            "appName": "Husen Hisab Demo",
            "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Husen-Hisab-Customer-Demo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
